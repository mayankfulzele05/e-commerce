apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ecommerce

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/mayankfulzele05/E-Commerce-microservices-application.git

    targetRevision: main

    path: K8s

  destination:

    server: https://kubernetes.default.svc

    namespace: default

  syncPolicy:

    automated:

      prune: true

      selfHeal: true
